name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # core/loader.py constructs a real aiogram Bot(token=BOT_TOKEN, ...) at import
      # time, and aiogram validates the token's shape (digits:alphanumeric) even
      # without hitting the network. Every other setting in core/config.py has a
      # safe default, but BOT_TOKEN doesn't, so it must be set here or test
      # collection fails for any module that imports a handler. This is a
      # syntactically-valid placeholder, not a real token - never use the real
      # BOT_TOKEN as a CI secret.
      BOT_TOKEN: "123456:FAKE-TOKEN-FOR-CI-0000000000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (weasyprint/PDF export)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
